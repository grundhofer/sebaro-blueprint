# ci: every push and pull request. Audit, lint, format, type check, the checks of the sebaro copy, unit tests, build
# with the size budgets, end-to-end tests against the build. Once a week it also asks whether a newer release of the
# sebaro copy exists; then update the copy with `node src/sebaro/checks/update-copy.mjs`, as one commit of its own.
# This file belongs to the product that copies the starter: it runs with the starter's folder as the root of the
# repository.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pnpm as package.json names it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (what the app ships)
        run: pnpm audit --prod --audit-level=high
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Format (Prettier)
        run: pnpm format:check
      - name: Type check (tsc --noEmit)
        run: pnpm check
      - name: The sebaro copy is unchanged, the product's files are what its declaration gives
        run: pnpm sebaro:verify && pnpm sebaro:product
      - name: Copy check, weekly (a newer release of the sebaro copy exists)
        if: github.event_name == 'schedule'
        run: node src/sebaro/checks/update-copy.mjs --check
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build, with the size budgets
        run: pnpm build
      - name: The app's own CSS and the built page keep sebaro's rules (lint-web.sh)
        run: pnpm sebaro:lint
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the build (Playwright, axe)
        run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
