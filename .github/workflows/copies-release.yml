# A pushed branch copies/<tag> becomes the draft of the release
# <tag>, with the branch's files as its assets. The branch comes from the workshop (copies.yml there); a person
# publishes the draft. Runs on a GitHub-hosted runner: the public guide gets no self-hosted one. The actions are
# pinned by commit, as in templates.yml, because this job may write to the repository.
name: copies-release
on:
  push:
    branches: ["copies/**"]
permissions:
  contents: write
concurrency:
  group: copies-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: The branch is one commit with the files its index names and nothing else
        run: |
          test "$(git rev-list --count HEAD)" = 1
          node --input-type=module - "${GITHUB_REF_NAME#copies/}" <<'EOF'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const tag = process.argv[2];
          const fail = (why) => { console.error(`::error::${why}`); process.exit(1); };
          if (!/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) fail(`the branch names no version: ${tag}`);
          const index = JSON.parse(fs.readFileSync("copies.json", "utf8"));
          if (index.tag !== tag) fail(`copies.json is of ${index.tag}, the branch of ${tag}`);
          const named = [index.updater, ...Object.values(index.profiles)];
          const want = ["copies.json", ...named.map((f) => f.file)].sort();
          const have = fs.readdirSync(".", { withFileTypes: true }).filter((e) => e.name !== ".git");
          if (have.some((e) => !e.isFile())) fail("the branch holds something that is no file");
          if (JSON.stringify(have.map((e) => e.name).sort()) !== JSON.stringify(want)) {
            fail(`the branch holds ${have.map((e) => e.name).sort()}, the index names ${want}`);
          }
          for (const f of named) {
            const data = fs.readFileSync(f.file);
            const sha256 = crypto.createHash("sha256").update(data).digest("hex");
            if (data.length !== f.bytes || sha256 !== f.sha256) fail(`${f.file} is not the file the index names`);
          }
          fs.writeFileSync(process.env.GITHUB_ENV, `COPIES_TAG=${tag}\nCOPIES_PROFILES=${Object.keys(index.profiles).join(" ")}\n`, { flag: "a" });
          EOF
      - name: The release's updater writes a copy of every profile, and each copy passes its own check
        run: |
          for profile in $COPIES_PROFILES; do
            node update-copy.mjs --from . --profile "$profile" --packs all --out "$RUNNER_TEMP/try/$profile"
            node "$RUNNER_TEMP/try/$profile/checks/verify-export.mjs" --strict
          done
      - name: Draft the release (never published from here)
        run: |
          if gh release view "$COPIES_TAG" > /dev/null 2>&1; then
            echo "::error::a release $COPIES_TAG exists already; delete its draft first, or use the next patch"
            exit 1
          fi
          gh release create "$COPIES_TAG" --draft --target main --title "sebaro $COPIES_TAG" \
            --notes "Die Kopien von sebaro $COPIES_TAG, eine je Profil. Holen und aktuell halten: update-copy.mjs (README einer Kopie, Abschnitt Keep in sync)." \
            copies.json update-copy.mjs sebaro-*.tar.gz
      - name: Delete the branch
        run: git push origin --delete "$GITHUB_REF_NAME"
