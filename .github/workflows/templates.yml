# The three starter templates under templates/ (website-astro, webapp-vite, desktop-tauri): each job installs its
# template from its own package-lock.json, checks its copy of the sebaro web export (verify-export.mjs --strict),
# builds it and runs its Playwright tests in Chromium (every screen light and dark at 100 % and, at the widest width, real 200 % text: axe
# with 0 violations, no sideways scroll, no cut text, no console or Content-Security-Policy error; keyboard paths).
# The desktop job also builds the Tauri app on Linux (debug, no bundle). Screenshots of every run are uploaded.
# Each template's copy of the export is a snapshot: a guide sync does not touch it; update it with npm run sebaro:sync.
# The website and the web app starter are products like any other: each holds the copy of the public release
# (update-copy.mjs), and its job runs what its own ci workflow runs (type check, lint, budgets; the web app with pnpm).
# The Android starter cannot be built here (the family's build setup is private): its job runs the three checks of
# its copy that need no Gradle.
name: templates
on:
  push:
    branches: [main]
    paths: ["templates/**", ".github/workflows/templates.yml"]
  pull_request:
    paths: ["templates/**", ".github/workflows/templates.yml"]
permissions:
  contents: read
jobs:
  # runs what the starter's own workflow runs (templates/website-astro/.github/workflows/ci.yml), without its weekly
  # question for a newer release of the sebaro copy
  website-astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/website-astro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/website-astro/package-lock.json
      - run: npm ci
      - name: Type check (astro check)
        run: npm run check
      - name: Lint (ESLint, Prettier)
        run: npm run lint
      - name: Copy check (the sebaro copy is unchanged, the product's files are what sebaro.product.json gives)
        run: npm run sebaro:verify
      - run: npx playwright install --with-deps chromium
      - name: Build (share images, stylesheet and sprite cut to the pages, the pages, the budgets)
        run: npm run build
      - name: Tests (the copy's lint on the built pages, Vitest, Playwright with axe)
        run: npm test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-astro-screens
          path: templates/website-astro/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # what the starter's own workflow runs (templates/webapp-vite/.github/workflows/ci.yml), from its folder
  webapp-vite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/webapp-vite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, pnpm as package.json names it
        with:
          package_json_file: templates/webapp-vite/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: templates/webapp-vite/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit (what the app ships)
        run: pnpm audit --prod --audit-level=high
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Format (Prettier)
        run: pnpm format:check
      - name: Type check (tsc --noEmit)
        run: pnpm check
      - name: The sebaro copy is unchanged, the product's files are what its declaration gives
        run: pnpm sebaro:verify && pnpm sebaro:product
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build, with the size budgets
        run: pnpm build
      - name: The app's own CSS and the built page keep sebaro's rules (lint-web.sh)
        run: pnpm sebaro:lint
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the build (Playwright, axe)
        run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp-vite-screens
          path: templates/webapp-vite/test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop-tauri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/desktop-tauri/package-lock.json
      - name: Tauri system packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (rustup is on the runner image)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: templates/desktop-tauri/src-tauri -> target
      - run: npm ci
      - name: sebaro export unchanged (verify-export.mjs --strict)
        run: npm run sebaro:verify
      - name: Frontend build (tsc + vite)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Screens (light/dark, 390/480/1440 px, 100/200 % text, axe, overflow, cut text, CSP) and keyboard
        run: npm test
      - name: Tauri app builds on Linux (debug, no bundle)
        run: npx tauri build --debug --no-bundle
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-tauri-screens
          path: templates/desktop-tauri/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Android starter builds only with the family's build setup, an export that is not in this repository
  # (templates/android-compose/README.md), so no Gradle build, test or lint can run here. What needs no build setup
  # runs: the starter's sebaro copy is unchanged, its sources keep sebaro's rules, and its product files are what
  # sebaro.product.json and the copy give.
  android-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/android-compose
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: sebaro copy unchanged (verify-export.mjs --strict)
        run: node sebaro/checks/verify-export.mjs sebaro --strict
      - name: sebaro's rules in the app's sources (lint-android.sh, silence means none is broken)
        run: sh sebaro/checks/lint-android.sh app/src
      - name: Product files are what sebaro.product.json and the copy give (product_kit.py check --no-raster)
        run: >
          python3 sebaro/product/product_kit.py check sebaro.product.json --copy sebaro --out sebaro-product
          --no-raster
