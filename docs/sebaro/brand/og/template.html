<!doctype html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<title>OG · {{docTitle}}</title>
<!-- {{generatedNote}} -->
<!-- sebaro share image, 1200 x 630, light ground like paper (spec/09 §18.1, W6a, W8a; D96). The one template of the
     workshop and of every website: brand/og/render.mjs fills it per page from a page list (brand/og/pages.schema.json)
     and renders it in Chromium; the workshop's brand/src/og/*.html are written from it (brand/src/og/*.pages.json).
     D143/D144: neutral ground, large type, key mark alone for studio. Footer key bar carries the address
     and sebaro. This bar follows the approved sheet as a reading for owner review. Page text also names the address.
     D96/D97: always light, no more than three title lines; overflow fails the browser build. -->
<link rel="stylesheet" href="{{fontsCss}}">
<link rel="stylesheet" href="{{tokensCss}}">
<link rel="stylesheet" href="{{spriteCss}}">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 32px 48px 24px;
    background: var(--sb-color-bg); color: var(--sb-color-text); font-family: var(--sb-font-family-ui);
    font-synthesis: none; display: grid; grid-template-rows: auto 1fr auto; row-gap: 16px;
  }
  body.og--start { row-gap: 16px; }
  .og-product { display: flex; align-items: center; gap: 16px; min-width: 0; white-space: nowrap;
                font-size: 28px; line-height: 36px; font-weight: var(--sb-type-title-weight);
                letter-spacing: var(--sb-type-title-tracking); }
  .og-product svg { display: block; flex: none; width: 56px; height: 56px; }
  .og-lockup svg { display: block; height: 56px; width: auto; color: var(--sb-color-text); }
  .og-text { align-self: center; min-width: 0; }
  .og-crumb { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; white-space: nowrap;
              font-size: 26px; line-height: 36px; color: var(--sb-color-text-muted);
              letter-spacing: var(--sb-type-body-tracking); }
  .og-crumb .sb-icon { color: var(--sb-color-text-muted); }
  .og-title { margin: 0; max-width: none; font-size: 104px; line-height: var(--sb-type-opening-line-height);
              font-weight: var(--sb-type-opening-weight); letter-spacing: var(--sb-type-opening-tracking);
              hyphens: manual; overflow-wrap: normal; }
  .og-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-width: 0;
             padding: 14px 26px 18px; background: var(--sb-tile-foot-band); color: var(--sb-tile-foot-line);
             border: 4px solid var(--sb-tile-foot-line); border-radius: var(--sb-radius-container);
             font-size: 34px; line-height: 1; font-weight: var(--sb-type-opening-weight); }
  .og-meta { margin: 0 0 12px; color: var(--sb-color-text-muted); font-size: 20px; line-height: 24px; }
  .og-mark { letter-spacing: -0.01em; }
  .og-apps { display: flex; gap: 24px; margin: 0; padding: 0; list-style: none; }
  .og-apps li { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 22px; line-height: 32px;
                font-weight: var(--sb-type-label-weight); letter-spacing: var(--sb-type-label-tracking); }
  .og-apps svg { display: block; flex: none; width: 48px; height: 48px; }
</style>
</head>
<body class="og og--{{variant}}">
{{#umbrella}}
  <div class="og-lockup">{{{lockupLarge}}}</div>
{{/umbrella}}
{{^umbrella}}
  <div class="og-product">{{{tile}}}{{productName}}</div>
{{/umbrella}}
  <div class="og-text">
{{#crumb.length}}
    <p class="og-crumb">{{#crumb}}{{#sep}}{{{chevron}}}{{/sep}}<span>{{text}}</span>{{/crumb}}</p>
{{/crumb.length}}
{{#meta}}<p class="og-meta">{{meta}}</p>{{/meta}}
    <h1 class="og-title">{{title}}</h1>
  </div>
  <div class="og-foot"><span class="og-address">{{address}}</span><span class="og-mark">sebaro</span></div>
</body>
</html>
